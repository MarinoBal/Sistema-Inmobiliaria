<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Preferencia de Cliente</title>
</head>
<body>
  <h2>Actualizar Preferencia de Cliente</h2>

  <form method="post" action="editarPreferencia.php">
      <label for="id">ID de la Preferencia:</label><br>
      <input type="number" name="id" id="id" required><br><br>

      <label for="idusuario">ID del Usuario:</label><br>
      <input type="number" name="idusuario" id="idusuario" required><br><br>

      <label for="idtipo">ID del Tipo de Propiedad:</label><br>
      <input type="number" name="idtipo" id="idtipo"><br><br>

      <label for="ciudad">Ciudad:</label><br>
      <input type="text" name="ciudad" id="ciudad"><br><br>

      <label for="colonia">Colonia:</label><br>
      <input type="text" name="colonia" id="colonia"><br><br>

      <label for="presupuestoMin">Presupuesto Mínimo:</label><br>
      <input type="number" step="0.01" name="presupuestoMin" id="presupuestoMin"><br><br>

      <label for="presupuestoMax">Presupuesto Máximo:</label><br>
      <input type="number" step="0.01" name="presupuestoMax" id="presupuestoMax"><br><br>

      <label for="minHabitaciones">Mínimo de Habitaciones:</label><br>
      <input type="number" name="minHabitaciones" id="minHabitaciones"><br><br>

      <label for="minBanos">Mínimo de Baños:</label><br>
      <input type="number" name="minBanos" id="minBanos"><br><br>

      <label for="minEstacionamientos">Mínimo de Estacionamientos:</label><br>
      <input type="number" name="minEstacionamientos" id="minEstacionamientos"><br><br>

      <label for="fecha">Fecha de Actualización:</label><br>
      <input type="date" name="fecha" id="fecha" required><br><br>

      <button type="submit">Actualizar Preferencia</button>
  </form>
</body>
</html>
