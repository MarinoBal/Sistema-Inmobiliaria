<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Cita</title>
</head>
<body>
  <h2>Actualizar Cita</h2>

  <form method="post" action="editarCita.php">
      <label for="id">ID de la Cita:</label><br>
      <input type="number" name="id" id="id" required><br><br>

      <label for="idusuario">ID del Usuario (Cliente):</label><br>
      <input type="number" name="idusuario" id="idusuario" required><br><br>

      <label for="idpropiedad">ID de la Propiedad:</label><br>
      <input type="number" name="idpropiedad" id="idpropiedad" required><br><br>

      <label for="idasesor">ID del Asesor:</label><br>
      <input type="number" name="idasesor" id="idasesor" required><br><br>

      <label for="fecha">Fecha de la Cita:</label><br>
      <input type="date" name="fecha" id="fecha" required><br><br>

      <label for="estado">Estado:</label><br>
      <select name="estado" id="estado" required>
          <option value="Pendiente">Pendiente</option>
          <option value="Confirmada">Confirmada</option>
          <option value="Cancelada">Cancelada</option>
          <option value="Completada">Completada</option>
      </select><br><br>

      <button type="submit">Actualizar Cita</button>
  </form>
</body>
</html>
