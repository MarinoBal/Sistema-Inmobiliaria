<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Valoración</title>
</head>
<body>
  <h2>Actualizar Valoración</h2>

  <form method="post" action="editarValoracion.php">
      <label for="id">ID de la Valoración:</label><br>
      <input type="number" name="id" id="id" required><br><br>

      <label for="idusuario">ID del Usuario (quien califica):</label><br>
      <input type="number" name="idusuario" id="idusuario" required><br><br>

      <label for="idagente">ID del Agente (opcional):</label><br>
      <input type="number" name="idagente" id="idagente"><br><br>

      <label for="idpropiedad">ID de la Propiedad (opcional):</label><br>
      <input type="number" name="idpropiedad" id="idpropiedad"><br><br>

      <label for="puntuacion">Puntuación (1 a 5):</label><br>
      <input type="number" name="puntuacion" id="puntuacion" min="1" max="5" required><br><br>

      <label for="comentario">Comentario:</label><br>
      <textarea name="comentario" id="comentario" rows="4" cols="50"></textarea><br><br>

      <label for="fecha">Fecha:</label><br>
      <input type="date" name="fecha" id="fecha" required><br><br>

      <button type="submit">Actualizar Valoración</button>
  </form>
</body>
</html>
