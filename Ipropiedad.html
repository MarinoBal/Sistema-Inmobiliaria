<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar Propiedad</title>
</head>
<body>
<h2>Registro de Propiedades</h2>
<form method="post" action="agregarPropiedad.php">
    <label>Título:</label><input type="text" name="titulo" required><br><br>
    <label>Descripción:</label><textarea name="descripcion"></textarea><br><br>
    <label>Precio:</label><input type="number" step="0.01" name="precio" required><br><br>
    <label>Dirección:</label><input type="text" name="direccion" required><br><br>
    <label>Ciudad:</label><input type="text" name="ciudad" required><br><br>
    <label>Colonia:</label><input type="text" name="colonia"><br><br>
    <label>Superficie (m²):</label><input type="number" name="superficie"><br><br>
    <label>Terreno (m²):</label><input type="number" name="terreno"><br><br>
    <label>Habitaciones:</label><input type="number" name="habitaciones"><br><br>
    <label>Baños:</label><input type="number" name="banos"><br><br>
    <label>Estacionamientos:</label><input type="number" name="estacionamientos"><br><br>
    <label>Estado:</label>
    <select name="estado" required>
        <option value="Disponible">Disponible</option>
        <option value="Rentada">Rentada</option>
        <option value="Vendida">Vendida</option>
    </select><br><br>

    <label>Tipo de Propiedad:</label>
    <select name="idTipo" required>
        <option value="">-- Seleccione un tipo --</option>
        <option value="1">Casa</option>
        <option value="2">Departamento/Condominio</option>
        <option value="3">Propiedad de Lujo</option>
        <option value="4">Propiedad Abandonada</option>
        <option value="5">Oficinas</option>
        <option value="6">Local comercial</option>
        <option value="7">Industrial</option>
        <option value="8">Terreno</option>
    </select><br><br>
    <label>ID Asesor:</label><input type="number" name="idAsesor" required><br><br>
    <button type="submit">Guardar</button>
</form>
</body>
</html>
